<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>畫界台灣 — 畫出消失的縣市界線</title>
<meta name="description" content="每天一題：兩個相鄰縣市之間的界線被擦掉了，憑印象把它畫回來，看看你劃錯了幾平方公里。">
<meta property="og:title" content="畫界台灣 — 畫出消失的縣市界線">
<meta property="og:description" content="每天一題：兩個相鄰縣市的界線被擦掉了，憑印象畫回來。">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root{
  --paper:#F6F4EC; --paper2:#EFECE1; --ink:#22211C; --ink2:#6B675B; --ink3:#9B968A;
  --rule:#DCD8CA; --land:#E7E2D2; --landline:#4A4638;
  --me:#C8452F; --truth:#1D6B62; --wrong:rgba(200,69,47,.28);
  --gold:#8A6A12;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  width:100%;max-width:560px;padding:14px 16px 6px;
  display:flex;align-items:baseline;gap:10px;flex:0 0 auto;
}
header b{font-size:20px;letter-spacing:.06em}
header .sub{font-size:12px;color:var(--ink3)}
header .no{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}

#task{
  width:100%;max-width:560px;padding:2px 16px 8px;flex:0 0 auto;
  font-size:14.5px;color:var(--ink2);line-height:1.55;
}
#task b{color:var(--ink)}
#task .vs{font-family:var(--mono);color:var(--ink3);padding:0 2px}

#stage{position:relative;width:100%;max-width:560px;flex:1;min-height:0;padding:0 10px}
canvas#map{
  width:100%;height:100%;display:block;touch-action:none;
  border-radius:10px;background:
    radial-gradient(120% 90% at 30% 20%, #FAF8F1 0%, var(--paper2) 100%);
  border:1px solid var(--rule);
  cursor:crosshair;
}
#toast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;padding:7px 14px;
  border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;
  white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:.94}

#result{
  position:absolute;inset:auto 10px 10px 10px;
  background:rgba(250,248,241,.96);border:1px solid var(--rule);border-radius:12px;
  padding:13px 15px;display:none;backdrop-filter:blur(4px);
  box-shadow:0 8px 28px rgba(30,28,20,.14);
}
#result.show{display:block}
#result .score{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
#result .grade{font-size:15px;margin-left:8px}
#result .detail{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.6}
#result .detail b{color:var(--me)}
#result .legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.sw{display:inline-block;width:16px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px;border-radius:2px}
#result .btns{display:flex;gap:8px;margin-top:11px}

footer{
  width:100%;max-width:560px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;flex:0 0 auto;
}
button{
  font:inherit;font-size:14px;padding:9px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--rule);background:#FDFCF8;color:var(--ink);transition:.12s;
}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary:hover{background:#000}
button:disabled{opacity:.4;cursor:not-allowed}
footer .hint{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right;line-height:1.4}
@media (max-height:640px){ header{padding-top:8px} #task{font-size:13px} }
</style>
</head>
<body>
<header>
  <b>畫界台灣</b><span class="sub">畫出消失的縣市界線</span>
  <span class="no" id="puzzleNo"></span>
</header>
<div id="task">載入地圖中…</div>

<div id="stage">
  <canvas id="map"></canvas>
  <div id="toast"></div>
  <div id="result">
    <span class="score" id="score"></span><span class="grade" id="grade"></span>
    <div class="detail" id="detail"></div>
    <div class="legend">
      <span><span class="sw" style="border-color:var(--truth)"></span>真實界線</span>
      <span><span class="sw" style="border-color:var(--me)"></span>你畫的</span>
      <span><span style="display:inline-block;width:14px;height:11px;background:var(--wrong);vertical-align:middle;margin-right:4px;border-radius:2px"></span>劃錯的領土</span>
    </div>
    <div class="btns">
      <button class="primary" id="btnShare">分享成績</button>
      <button id="btnAgain">再畫一次</button>
      <button id="btnNext">練習下一題</button>
    </div>
  </div>
</div>

<footer>
  <button id="btnClear">重畫</button>
  <button id="btnPractice">練習模式</button>
  <div class="hint" id="hint">從 ● 一筆畫到 ●</div>
</footer>

<script>
"use strict";
const $=s=>document.querySelector(s);
const EPOCH="2026-08-12";                  // 第 1 題的日期（台北時間）
const R_EARTH=6371;                        // km
let topo,counties,geoms,pool,cur=null;
let drawing=false,pts=[],done=false,practice=false;

/* ── 日期（Asia/Taipei）與每日題號 ── */
function taipeiToday(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return p; // YYYY-MM-DD
}
function dayNumber(){
  const ms=Date.UTC(...taipeiToday().split("-").map(Number).map((v,i)=>i===1?v-1:v))
          -Date.UTC(...EPOCH.split("-").map(Number).map((v,i)=>i===1?v-1:v));
  return Math.round(ms/86400000)+1;        // #1 起算
}
/* 種子洗牌：整個池排列一輪後才重複 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){
  const r=mulberry32(seed),a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* ── 幾何 ── */
const cname=g=>g.properties.COUNTYNAME;
function borderOf(a,b){
  return topojson.mesh(topo,{type:"GeometryCollection",geometries:[a,b]},(x,y)=>x!==y);
}
function isRing(line){const s=line[0],e=line[line.length-1];return s[0]===e[0]&&s[1]===e[1]}
function buildPool(){
  const out=[];
  for(let i=0;i<geoms.length;i++)for(let j=i+1;j<geoms.length;j++){
    const m=borderOf(geoms[i],geoms[j]);
    if(!m.coordinates.length) continue;
    if(m.coordinates.some(isRing)) continue;          // 飛地（台北市/新北市、嘉義市/嘉義縣）不可畫線
    out.push([i,j]);
  }
  return out;
}

/* ── 畫布 ── */
const cv=$("#map"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,proj,path,anchors=[],SNAP=26;
function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(r.width);H=Math.round(r.height);
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(cur) fit(), render();
}
function fit(){
  proj=d3.geoMercator();
  const pad=34;
  proj.fitExtent([[pad,pad+6],[W-pad,H-pad-6]],cur.unionFeat);
  path=d3.geoPath(proj,ctx);
  cur.borderPx=cur.borderGeo.map(p=>proj(p));
  anchors=[cur.borderPx[0],cur.borderPx[cur.borderPx.length-1]];
}
function loadRound(pair){
  const [i,j]=pair;
  const a=geoms[i],b=geoms[j];
  const union=topojson.merge(topo,[a,b]);
  const mesh=borderOf(a,b);
  // 取最長線段（資料驗證全為單段，此為保險）
  const line=mesh.coordinates.slice().sort((p,q)=>q.length-p.length)[0];
  cur={a,b,
    unionGeom:union,
    unionFeat:{type:"Feature",geometry:union},
    featA:{type:"Feature",geometry:topojson.merge(topo,[a])},
    featB:{type:"Feature",geometry:topojson.merge(topo,[b])},
    borderGeo:line,
    unionKm2:d3.geoArea(union)*R_EARTH*R_EARTH,
  };
  pts=[];done=false;$("#result").classList.remove("show");
  $("#task").innerHTML=`<b>${cname(a)}</b><span class="vs">×</span><b>${cname(b)}</b> 之間的界線被擦掉了——憑印象把它畫回來。`;
  fit();render();
}

/* ── 渲染 ── */
function drawGeo(feat){ctx.beginPath();path(feat.geometry||feat);}
function render(){
  ctx.clearRect(0,0,W,H);
  // 陸地
  drawGeo(cur.unionFeat);
  ctx.fillStyle=getCss("--land");ctx.fill();
  ctx.strokeStyle=getCss("--landline");ctx.lineWidth=1.6;ctx.lineJoin="round";ctx.stroke();

  if(done){
    // 揭曉：劃錯區塊（even-odd 口袋 ∩ 聯集）
    ctx.save();
    drawGeo(cur.unionFeat);ctx.clip();
    ctx.beginPath();
    pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    for(let k=cur.borderPx.length-1;k>=0;k--)ctx.lineTo(cur.borderPx[k][0],cur.borderPx[k][1]);
    ctx.closePath();
    ctx.fillStyle=getCss("--wrong");ctx.fill("evenodd");
    ctx.restore();
    // 真實界線
    ctx.beginPath();
    cur.borderPx.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle=getCss("--truth");ctx.lineWidth=2.6;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([]);
  }
  // 使用者的線
  if(pts.length>1){
    ctx.beginPath();
    pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle=getCss("--me");ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
  }
  // 端點
  for(const a of anchors){
    ctx.beginPath();ctx.arc(a[0],a[1],7,0,7);ctx.fillStyle="#FDFCF8";ctx.fill();
    ctx.lineWidth=2.4;ctx.strokeStyle=getCss("--me");ctx.stroke();
    ctx.beginPath();ctx.arc(a[0],a[1],2.6,0,7);ctx.fillStyle=getCss("--me");ctx.fill();
  }
  // 縣市名（揭曉前放質心，揭曉後不變）
  ctx.font=`600 ${Math.max(15,Math.min(19,W/22))}px ${getCss("--sans")}`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const [f,g] of [[cur.featA,cur.a],[cur.featB,cur.b]]){
    const c=d3.geoPath(proj).centroid(f);
    if(!isFinite(c[0]))continue;
    const t=cname(g);
    ctx.lineWidth=4;ctx.strokeStyle="rgba(246,244,236,.85)";ctx.strokeText(t,c[0],c[1]);
    ctx.fillStyle=done?getCss("--ink"):getCss("--ink2");ctx.fillText(t,c[0],c[1]);
  }
}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

/* ── 輸入 ── */
function xy(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
cv.addEventListener("pointerdown",e=>{
  if(done)return;
  const p=xy(e);
  const near=anchors.find(a=>dist(p,a)<SNAP);
  if(!near){toast("從其中一個 ● 開始畫");return}
  drawing=true;pts=[near.slice()];
  cv.setPointerCapture(e.pointerId);
  render();
});
cv.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=xy(e);
  if(dist(p,pts[pts.length-1])>2.2){pts.push(p);render()}
});
cv.addEventListener("pointerup",()=>{
  if(!drawing)return;
  drawing=false;
  const start=pts[0],end=pts[pts.length-1];
  const other=anchors.find(a=>dist(a,start)>1);       // 另一端
  if(dist(end,other)<SNAP*1.4){pts.push(other.slice());finish()}
  else{toast("要一路畫到另一個 ● 才算完成");pts=[];render()}
});

/* ── 計分：光柵化「口袋 ∩ 聯集」 ── */
function scoreDraw(){
  const S=2,off=document.createElement("canvas");
  off.width=W*S;off.height=H*S;
  const o=off.getContext("2d");o.scale(S,S);
  const p2=d3.geoPath(proj,o);
  // 紅色通道：聯集
  o.beginPath();p2(cur.unionGeom);o.fillStyle="#f00";o.fill();
  // 綠色通道：口袋（even-odd）
  o.globalCompositeOperation="lighter";
  o.beginPath();
  pts.forEach((p,k)=>k?o.lineTo(p[0],p[1]):o.moveTo(p[0],p[1]));
  for(let k=cur.borderPx.length-1;k>=0;k--)o.lineTo(cur.borderPx[k][0],cur.borderPx[k][1]);
  o.closePath();o.fillStyle="#0f0";o.fill("evenodd");
  const img=o.getImageData(0,0,off.width,off.height).data;
  let union=0,wrong=0;
  for(let i=0;i<img.length;i+=4){
    if(img[i]>120){union++;if(img[i+1]>120)wrong++}
  }
  return{ratio:union?wrong/union:0,union};
}
function finish(){
  done=true;
  const {ratio}=scoreDraw();
  const pct=Math.max(0,Math.round((1-ratio)*1000)/10);
  const km2=cur.unionKm2*ratio;
  const grade=pct>=97?"🏆 神級":pct>=93?"🥇 在地人":pct>=85?"🥈 有印象":pct>=70?"🥉 大概方向對":"🧭 迷路了";
  $("#score").textContent=pct+"%";
  $("#grade").textContent=grade;
  $("#detail").innerHTML=`你把 <b>${km2<1?km2.toFixed(2):km2<10?km2.toFixed(1):Math.round(km2)} km²</b> 劃給了錯的縣市（兩縣市合計 ${Math.round(cur.unionKm2).toLocaleString()} km²）`;
  $("#result").classList.add("show");
  cur.lastPct=pct;cur.lastGrade=grade;
  render();
}

/* ── 工具 ── */
let toastT;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1900)}
$("#btnClear").onclick=()=>{if(done)return;pts=[];render()};
$("#btnAgain").onclick=()=>{pts=[];done=false;$("#result").classList.remove("show");render()};
$("#btnNext").onclick=()=>{practice=true;$("#puzzleNo").textContent="練習";loadRound(pool[Math.floor(Math.random()*pool.length)])};
$("#btnPractice").onclick=()=>$("#btnNext").onclick();
$("#btnShare").onclick=async()=>{
  const n=$("#puzzleNo").textContent;
  const blocks=(p=>p>=97?"🟩🟩🟩🟩🟩":p>=85?"🟩🟩🟩🟩⬜":p>=70?"🟩🟩🟩⬜⬜":p>=50?"🟩🟩⬜⬜⬜":"🟩⬜⬜⬜⬜")(cur.lastPct);
  const txt=`畫界台灣 ${n}\n${cname(cur.a)} × ${cname(cur.b)}\n${blocks} ${cur.lastPct}%（劃錯 ${Math.round(cur.unionKm2*(1-cur.lastPct/100))} km²）\n${location.origin+location.pathname}`;
  try{
    if(navigator.share)await navigator.share({text:txt});
    else{await navigator.clipboard.writeText(txt);toast("已複製，貼去炫耀吧")}
  }catch{}
};

/* ── 啟動 ── */
fetch("counties-10t.json").then(r=>r.json()).then(t=>{
  topo=t;counties=t.objects.counties;geoms=counties.geometries;
  pool=buildPool();
  const n=dayNumber();
  const order=shuffled(pool,20260812);
  const pair=order[((n-1)%order.length+order.length)%order.length];
  $("#puzzleNo").textContent="#"+n;
  new ResizeObserver(resize).observe(cv);
  resize();
  loadRound(pair);
  // 開發測試鉤子：?test=perfect|offset 自動作答，供 headless 驗計分
  const testMode=new URLSearchParams(location.search).get("test");
  if(testMode){setTimeout(()=>{
    pts=cur.borderPx.map(p=>testMode==="offset"?[p[0]+30,p[1]+18]:p.slice());
    if(testMode==="offset"){pts[0]=cur.borderPx[0].slice();pts[pts.length-1]=cur.borderPx[cur.borderPx.length-1].slice()}
    finish();
    document.title=`TEST ${testMode} score=${cur.lastPct}`;
  },600)}
}).catch(e=>{$("#task").textContent="地圖載入失敗："+e.message});
window.addEventListener("resize",resize);
</script>
</body>
</html>
