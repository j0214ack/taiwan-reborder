<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>畫界台灣 — 畫出消失的縣市界線</title>
<meta name="description" content="每天一題：兩個相鄰縣市之間的界線被擦掉了，憑印象把它畫回來，看看你劃錯了幾平方公里。">
<meta property="og:title" content="畫界台灣 — 畫出消失的縣市界線">
<meta property="og:description" content="每天一題：兩個相鄰縣市的界線被擦掉了，憑印象畫回來。">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root{
  --paper:#F6F4EC; --paper2:#EFECE1; --ink:#22211C; --ink2:#6B675B; --ink3:#9B968A;
  --rule:#DCD8CA; --land:#E7E2D2; --landline:#4A4638;
  --me:#C8452F; --truth:#1D6B62; --wrong:rgba(200,69,47,.28);
  --gold:#8A6A12;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  width:100%;max-width:560px;padding:14px 16px 6px;
  display:flex;align-items:baseline;gap:10px;flex:0 0 auto;
}
header b{font-size:20px;letter-spacing:.06em}
header .sub{font-size:12px;color:var(--ink3)}
header .no{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}

#task{
  width:100%;max-width:560px;padding:2px 16px 8px;flex:0 0 auto;
  font-size:14.5px;color:var(--ink2);line-height:1.55;
}
#task b{color:var(--ink)}
#task .vs{font-family:var(--mono);color:var(--ink3);padding:0 2px}

#stage{position:relative;width:100%;max-width:560px;flex:1;min-height:0;padding:0 10px}
canvas#map{
  width:100%;height:100%;display:block;touch-action:none;
  border-radius:10px;background:
    radial-gradient(120% 90% at 30% 20%, #FAF8F1 0%, var(--paper2) 100%);
  border:1px solid var(--rule);
  cursor:crosshair;
}
#toast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;padding:7px 14px;
  border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;
  white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:.94}

#result{
  position:absolute;inset:auto 10px 10px 10px;
  background:rgba(250,248,241,.96);border:1px solid var(--rule);border-radius:12px;
  padding:13px 15px;display:none;backdrop-filter:blur(4px);
  box-shadow:0 8px 28px rgba(30,28,20,.14);
}
#result.show{display:block}
#result .score{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
#result .grade{font-size:15px;margin-left:8px}
#result .detail{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.6}
#result .detail b{color:var(--me)}
#result .legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.sw{display:inline-block;width:16px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px;border-radius:2px}
#result .btns{display:flex;gap:8px;margin-top:11px}

footer{
  width:100%;max-width:560px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;flex:0 0 auto;
}
button{
  font:inherit;font-size:14px;padding:9px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--rule);background:#FDFCF8;color:var(--ink);transition:.12s;
}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary:hover{background:#000}
button:disabled{opacity:.4;cursor:not-allowed}
footer .hint{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right;line-height:1.4}
@media (max-height:640px){ header{padding-top:8px} #task{font-size:13px} }
</style>
</head>
<body>
<header>
  <b>畫界台灣</b><span class="sub">畫出消失的縣市界線</span>
  <span class="no" id="puzzleNo"></span>
</header>
<div id="task">載入地圖中…</div>

<div id="stage">
  <canvas id="map"></canvas>
  <div id="toast"></div>
  <div id="result">
    <span class="score" id="score"></span><span class="grade" id="grade"></span>
    <div class="detail" id="detail"></div>
    <div class="legend">
      <span><span class="sw" style="border-color:var(--truth)"></span>真實界線</span>
      <span><span class="sw" style="border-color:var(--me)"></span>你畫的</span>
      <span><span style="display:inline-block;width:14px;height:11px;background:var(--wrong);vertical-align:middle;margin-right:4px;border-radius:2px"></span>劃錯的領土</span>
    </div>
    <div class="btns">
      <button class="primary" id="btnShare">分享成績</button>
      <button id="btnSaveImg">存成績圖</button>
      <button id="btnAgain">再畫一次</button>
      <button id="btnNext">練習下一題</button>
    </div>
  </div>
</div>

<footer>
  <button id="btnClear">重畫</button>
  <button id="btnPractice">練習模式</button>
  <button id="btnMode">簡單模式：關</button>
  <div class="hint" id="hint"></div>
</footer>

<script>
"use strict";
const $=s=>document.querySelector(s);
const EPOCH="2026-08-12";                  // 第 1 題的日期（台北時間）
const R_EARTH=6371;                        // km
let topo,counties,geoms,pool,cur=null;
let drawing=false,pts=[],done=false,practice=false;
/* 模式：free＝原版自由畫（預設）；easy＝顯示端點錨點 */
let mode=localStorage.getItem("huajie.mode")==="easy"?"easy":"free";

/* ── 日期（Asia/Taipei）與每日題號 ── */
function taipeiToday(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return p; // YYYY-MM-DD
}
function dayNumber(){
  const ms=Date.UTC(...taipeiToday().split("-").map(Number).map((v,i)=>i===1?v-1:v))
          -Date.UTC(...EPOCH.split("-").map(Number).map((v,i)=>i===1?v-1:v));
  return Math.round(ms/86400000)+1;        // #1 起算
}
/* 種子洗牌：整個池排列一輪後才重複 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){
  const r=mulberry32(seed),a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* ── 幾何 ── */
const cname=g=>g.properties.COUNTYNAME;
function borderOf(a,b){
  return topojson.mesh(topo,{type:"GeometryCollection",geometries:[a,b]},(x,y)=>x!==y);
}
function isRing(line){const s=line[0],e=line[line.length-1];return s[0]===e[0]&&s[1]===e[1]}
function buildPool(){
  const out=[];
  for(let i=0;i<geoms.length;i++)for(let j=i+1;j<geoms.length;j++){
    const m=borderOf(geoms[i],geoms[j]);
    if(!m.coordinates.length) continue;
    if(m.coordinates.some(isRing)) continue;          // 飛地（台北市/新北市、嘉義市/嘉義縣）不可畫線
    out.push([i,j]);
  }
  return out;
}

/* ── 畫布 ── */
const cv=$("#map"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,proj,path,anchors=[],SNAP=26;
function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.round(r.width);H=Math.round(r.height);
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(cur) fit(), render();
}
function fit(){
  proj=d3.geoMercator();
  const pad=34;
  proj.fitExtent([[pad,pad+6],[W-pad,H-pad-6]],cur.unionFeat);
  path=d3.geoPath(proj,ctx);
  cur.borderPx=cur.borderGeo.map(p=>proj(p));
  anchors=[cur.borderPx[0],cur.borderPx[cur.borderPx.length-1]];
  // 計分脈絡（皆隨視窗尺寸重算）
  cur.kmPerPx=cur.Lkm/Math.max(1e-6,polyLen(cur.borderPx));
  const bb=d3.geoPath(proj).bounds(cur.unionFeat);
  cur.extentKm=Math.hypot(bb[1][0]-bb[0][0],bb[1][1]-bb[0][1])*cur.kmPerPx;
  cur.gKm=0.008*cur.extentKm;                       // 手繪精度寬容區
  const B=resampleN(cur.borderPx,128), A=anchors;
  const dChordPx=B.reduce((s,p)=>s+segDist(p,A[0],A[1]),0)/B.length;
  cur.dChordKm=dChordPx*cur.kmPerPx;                // 這題「直線亂猜」的平均偏移
  cur.tauKm=Math.max(cur.gKm,1.6*cur.dChordKm);     // 難度尺度（1.6 倍＝Yo 2026-08-31 實玩後放緩）
}
function haversineKm(p,q){
  const rad=Math.PI/180;
  const dLat=(q[1]-p[1])*rad, dLon=(q[0]-p[0])*rad;
  const s=Math.sin(dLat/2)**2+Math.cos(p[1]*rad)*Math.cos(q[1]*rad)*Math.sin(dLon/2)**2;
  return 2*R_EARTH*Math.asin(Math.sqrt(s));
}
function loadRound(pair){
  const [i,j]=pair;
  const a=geoms[i],b=geoms[j];
  const union=topojson.merge(topo,[a,b]);
  const mesh=borderOf(a,b);
  // 取最長線段（資料驗證全為單段，此為保險）
  const line=mesh.coordinates.slice().sort((p,q)=>q.length-p.length)[0];
  let Lkm=0;
  for(let k=1;k<line.length;k++)Lkm+=haversineKm(line[k-1],line[k]);
  cur={a,b,
    unionGeom:union,
    unionFeat:{type:"Feature",geometry:union},
    featA:{type:"Feature",geometry:topojson.merge(topo,[a])},
    featB:{type:"Feature",geometry:topojson.merge(topo,[b])},
    borderGeo:line,
    Lkm,
    unionKm2:d3.geoArea(union)*R_EARTH*R_EARTH,
  };
  pts=[];done=false;$("#result").classList.remove("show");
  $("#task").innerHTML=`<b>${cname(a)}</b><span class="vs">×</span><b>${cname(b)}</b> 之間的界線被擦掉了——憑印象把它畫回來。`;
  fit();render();updateHint();
}

/* ── 渲染 ── */
function drawGeo(feat){ctx.beginPath();path(feat.geometry||feat);}
function render(){
  ctx.clearRect(0,0,W,H);
  // 陸地
  drawGeo(cur.unionFeat);
  ctx.fillStyle=getCss("--land");ctx.fill();
  ctx.strokeStyle=getCss("--landline");ctx.lineWidth=1.6;ctx.lineJoin="round";ctx.stroke();

  if(done){
    // 揭曉：偏差區塊（口袋 ∩ 聯集）。自由畫的線頭尾不連錨點，先接到界線端點再閉合
    ctx.save();
    drawGeo(cur.unionFeat);ctx.clip();
    ctx.beginPath();
    pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    for(let k=cur.borderPx.length-1;k>=0;k--)ctx.lineTo(cur.borderPx[k][0],cur.borderPx[k][1]);
    ctx.closePath();
    ctx.fillStyle=getCss("--wrong");ctx.fill("evenodd");
    ctx.restore();
    // 真實界線
    ctx.beginPath();
    cur.borderPx.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle=getCss("--truth");ctx.lineWidth=2.6;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([]);
  }
  // 使用者的線
  if(pts.length>1){
    ctx.beginPath();
    pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle=getCss("--me");ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
  }
  // 端點錨點：只有簡單模式顯示（自由畫模式下「起訖在哪」本身是考題）；揭曉後兩種模式都顯示
  if(mode==="easy"||done){
    for(const a of anchors){
      ctx.beginPath();ctx.arc(a[0],a[1],7,0,7);ctx.fillStyle="#FDFCF8";ctx.fill();
      ctx.lineWidth=2.4;ctx.strokeStyle=getCss(done&&mode==="free"?"--truth":"--me");ctx.stroke();
      ctx.beginPath();ctx.arc(a[0],a[1],2.6,0,7);ctx.fillStyle=getCss(done&&mode==="free"?"--truth":"--me");ctx.fill();
    }
  }
  // 縣市名（揭曉前放質心，揭曉後不變）
  ctx.font=`600 ${Math.max(15,Math.min(19,W/22))}px ${getCss("--sans")}`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const [f,g] of [[cur.featA,cur.a],[cur.featB,cur.b]]){
    const c=d3.geoPath(proj).centroid(f);
    if(!isFinite(c[0]))continue;
    const t=cname(g);
    ctx.lineWidth=4;ctx.strokeStyle="rgba(246,244,236,.85)";ctx.strokeText(t,c[0],c[1]);
    ctx.fillStyle=done?getCss("--ink"):getCss("--ink2");ctx.fillText(t,c[0],c[1]);
  }
}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

/* ── 幾何工具（計分共用）── */
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
function segDist(p,a,b){
  const vx=b[0]-a[0],vy=b[1]-a[1];
  const t=Math.max(0,Math.min(1,((p[0]-a[0])*vx+(p[1]-a[1])*vy)/(vx*vx+vy*vy||1)));
  return Math.hypot(p[0]-a[0]-t*vx,p[1]-a[1]-t*vy);
}
function polyLen(pts){let s=0;for(let i=1;i<pts.length;i++)s+=dist(pts[i-1],pts[i]);return s}
function nearestD(p,poly){let m=1/0;for(let i=1;i<poly.length;i++)m=Math.min(m,segDist(p,poly[i-1],poly[i]));return m}
function resampleN(pts,n){
  if(pts.length<2)return pts.slice();
  const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+dist(pts[i-1],pts[i]));
  const L=c[c.length-1],out=[];let j=1;
  for(let k=0;k<n;k++){
    const t=k/(n-1)*L;
    while(j<c.length-1&&c[j]<t)j++;
    const seg=c[j]-c[j-1],f=seg?(t-c[j-1])/seg:0;
    out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*f,pts[j-1][1]+(pts[j][1]-pts[j-1][1])*f]);
  }
  return out;
}
const meanOf=a=>a.reduce((x,y)=>x+y,0)/a.length;

/* ── 輸入 ── */
function xy(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener("pointerdown",e=>{
  if(done)return;
  const p=xy(e);
  if(mode==="easy"){
    const near=anchors.find(a=>dist(p,a)<SNAP);
    if(!near){toast("從其中一個 ● 開始畫");return}
    pts=[near.slice()];
  }else{
    pts=[p];
  }
  drawing=true;
  cv.setPointerCapture(e.pointerId);
  render();
});
cv.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=xy(e);
  if(dist(p,pts[pts.length-1])>2.2){pts.push(p);render()}
});
cv.addEventListener("pointerup",()=>{
  if(!drawing)return;
  drawing=false;
  if(mode==="easy"){
    const start=pts[0],end=pts[pts.length-1];
    const other=anchors.find(a=>dist(a,start)>1);     // 另一端
    if(dist(end,other)<SNAP*1.4){pts.push(other.slice());finish()}
    else{toast("要一路畫到另一個 ● 才算完成");pts=[];render()}
  }else{
    // 自由畫：太短視為誤觸
    if(polyLen(pts)<dist(anchors[0],anchors[1])*0.25){toast("線太短了——要畫出整條界線（包含它從哪開始、到哪結束）");pts=[];render()}
    else finish();
  }
});

/* ── 計分（v2）：弧長對應（Yo 的同位置比同位置）＋對稱最近距離＋P90，
      寬容區內不扣分，難度尺度＝本題直線亂猜的平均偏移 ── */
function trimToBorder(U){
  // 把使用者線裁到「最接近界線兩端」的區間——超畫的尾巴不進距離計分
  //（否則尾巴同時污染對應／Chamfer／P90 三項；端點準度另計，超畫仍會小扣）
  const b0=cur.borderPx[0],b1=cur.borderPx[cur.borderPx.length-1];
  let i0=0,i1=U.length-1,d0=1/0,d1=1/0;
  U.forEach((p,i)=>{const a=dist(p,b0),b=dist(p,b1);if(a<d0){d0=a;i0=i}if(b<d1){d1=b;i1=i}});
  const lo=Math.min(i0,i1),hi=Math.max(i0,i1);
  return hi-lo>=8?U.slice(lo,hi+1):U;
}
function computeScore(){
  const K=cur.kmPerPx;
  const B=resampleN(cur.borderPx,128);
  const Ut=trimToBorder(resampleN(pts,128));
  const U=resampleN(Ut,128);
  // 對稱最近距離（Chamfer）
  const dBU=B.map(p=>nearestD(p,Ut));
  const dUB=U.map(p=>nearestD(p,cur.borderPx));
  const chamKm=(meanOf(dBU)+meanOf(dUB))/2*K;
  const p90Km=dBU.slice().sort((a,b)=>a-b)[Math.floor(dBU.length*0.9)]*K;
  // 弧長對應：第 i 點對第 i 點，正反向取優（自由畫可從任一端起筆）
  const corrF=meanOf(B.map((p,i)=>dist(p,U[i])));
  const corrR=meanOf(B.map((p,i)=>dist(p,U[U.length-1-i])));
  const corrKm=Math.min(corrF,corrR)*K;
  // 綜合偏差：形狀對應＋整體貼合；P90 只留小權重（彎折界線上它對真人太兇）
  const D=0.40*corrKm+0.45*chamKm+0.15*p90Km;
  let base=Math.exp(-Math.max(0,D-cur.gKm)/cur.tauKm);
  // 自由畫加兩道門：端點準度（起訖位置也是考題）與覆蓋率
  let endKm=0,cov=1;
  if(mode==="free"){
    const b0=cur.borderPx[0],b1=cur.borderPx[cur.borderPx.length-1];
    const u0=pts[0],u1=pts[pts.length-1];
    endKm=Math.min((dist(b0,u0)+dist(b1,u1))/2,(dist(b0,u1)+dist(b1,u0))/2)*K;
    base*=Math.exp(-0.35*Math.max(0,endKm-3*cur.gKm)/cur.tauKm);
    const corridor=3*cur.tauKm/K;
    cov=dBU.filter(d=>d<=corridor).length/dBU.length;
    base*=Math.pow(cov,0.7);
  }
  return{
    pct:Math.max(0,Math.min(100,Math.round(base*100))),
    meanDevKm:chamKm,
    areaKm2:chamKm*cur.Lkm,      // ≈ ∫偏移 ds，當分享哏不當分數
    endKm,cov,
    dbg:{corrKm,chamKm,p90Km,D,gKm:cur.gKm,tauKm:cur.tauKm,dChordKm:cur.dChordKm,extentKm:cur.extentKm,kmPerPx:cur.kmPerPx},
  };
}
function finish(){
  done=true;
  const r=computeScore();
  const pct=r.pct;
  const grade=pct>=95?"🏆 神級":pct>=85?"🥇 在地人":pct>=70?"🥈 有印象":pct>=50?"🥉 大概方向對":"🧭 迷路了";
  $("#score").textContent=pct+"%";
  $("#grade").textContent=grade;
  const dev=r.meanDevKm<10?r.meanDevKm.toFixed(1):Math.round(r.meanDevKm);
  const km2=r.areaKm2<10?r.areaKm2.toFixed(1):Math.round(r.areaKm2);
  let extra=mode==="free"&&r.endKm>3*cur.gKm?`；起訖點偏了約 ${r.endKm.toFixed(1)} km`:"";
  $("#detail").innerHTML=`你的線平均偏離真實界線 <b>${dev} km</b>（≈ 劃錯 ${km2} km² 的領土）${extra}`;
  $("#result").classList.add("show");
  cur.lastPct=pct;cur.lastGrade=grade;cur.lastDev=r.meanDevKm;cur.lastKm2=r.areaKm2;
  render();
}

/* ── 工具 ── */
let toastT;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1900)}
function updateHint(){
  $("#hint").textContent=mode==="easy"
    ?"從一個 ● 一筆畫到另一個 ●"
    :"憑印象一筆畫出整條界線——從哪開始、到哪結束，也是題目的一部分";
  $("#btnMode").textContent=mode==="easy"?"簡單模式：開":"簡單模式：關";
}
$("#btnMode").onclick=()=>{
  mode=mode==="easy"?"free":"easy";
  localStorage.setItem("huajie.mode",mode);
  pts=[];done=false;$("#result").classList.remove("show");
  updateHint();render();
  toast(mode==="easy"?"簡單模式：顯示界線兩端 ●，畫線頭尾吸附":"自由畫：整條界線（含起訖）都憑印象");
};
$("#btnClear").onclick=()=>{if(done)return;pts=[];render()};
$("#btnAgain").onclick=()=>{pts=[];done=false;$("#result").classList.remove("show");render()};
$("#btnNext").onclick=()=>{practice=true;$("#puzzleNo").textContent="練習";loadRound(pool[Math.floor(Math.random()*pool.length)])};
$("#btnPractice").onclick=()=>$("#btnNext").onclick();
function shareText(){
  const n=$("#puzzleNo").textContent;
  const blocks=(p=>p>=95?"🟩🟩🟩🟩🟩":p>=85?"🟩🟩🟩🟩⬜":p>=70?"🟩🟩🟩⬜⬜":p>=50?"🟩🟩⬜⬜⬜":"🟩⬜⬜⬜⬜")(cur.lastPct);
  const devTxt=cur.lastDev<10?cur.lastDev.toFixed(1):Math.round(cur.lastDev);
  const modeTag=mode==="easy"?"（簡單模式）":"";
  return`畫界台灣 ${n}${modeTag}\n${cname(cur.a)} × ${cname(cur.b)}\n${blocks} ${cur.lastPct}%（平均偏 ${devTxt} km）\n${location.origin+location.pathname}`;
}
/* ── 成績卡：揭曉畫面合成一張可分享 PNG（1080×1350，純客戶端）── */
function buildShareCard(){
  const CW=1080,CH=1350,M=64;
  const c=document.createElement("canvas");c.width=CW;c.height=CH;
  const g=c.getContext("2d");
  const sans=getCss("--sans");
  g.fillStyle=getCss("--paper");g.fillRect(0,0,CW,CH);
  // 標題列：畫界台灣 #N ─────── 縣市對
  g.textBaseline="alphabetic";
  g.textAlign="left";g.fillStyle=getCss("--ink");g.font=`800 54px ${sans}`;
  g.fillText("畫界台灣",M,118);
  const tw=g.measureText("畫界台灣").width;
  g.fillStyle=getCss("--ink3");g.font=`600 40px ${sans}`;
  g.fillText(`${$("#puzzleNo").textContent}${mode==="easy"?"・簡單模式":""}`,M+tw+22,118);
  g.textAlign="right";g.fillStyle=getCss("--ink");g.font=`700 44px ${sans}`;
  g.fillText(`${cname(cur.a)} × ${cname(cur.b)}`,CW-M,118);
  // 分數列
  g.textAlign="left";g.fillStyle=getCss("--me");g.font=`800 148px ${sans}`;
  g.fillText(cur.lastPct+"%",M,290);
  const sw=g.measureText(cur.lastPct+"%").width;
  g.fillStyle=getCss("--ink");g.font=`700 54px ${sans}`;
  g.fillText(cur.lastGrade,M+sw+30,290);
  // 地圖快照：直接取畫面 canvas（已是揭曉狀態），等比置中
  const box={x:M,y:330,w:CW-2*M,h:830};
  const s=Math.min(box.w/cv.width,box.h/cv.height);
  const dw=cv.width*s,dh=cv.height*s;
  g.drawImage(cv,box.x+(box.w-dw)/2,box.y+(box.h-dh)/2,dw,dh);
  // 底部：偏差＋網址＋出處
  const devTxt=cur.lastDev<10?cur.lastDev.toFixed(1):Math.round(cur.lastDev);
  const km2=cur.lastKm2<10?cur.lastKm2.toFixed(1):Math.round(cur.lastKm2);
  g.fillStyle=getCss("--ink2");g.font=`500 38px ${sans}`;
  g.fillText(`平均偏離真實界線 ${devTxt} km（≈ 劃錯 ${km2} km²）`,M,1226);
  g.fillStyle=getCss("--ink3");g.font=`500 36px ${getCss("--mono")}`;
  g.fillText(location.origin+location.pathname,M,1282);
  g.fillStyle=getCss("--ink3");g.font=`400 26px ${sans}`;
  g.fillText("本 App 靈感來源自 reborder.app",M,1326);
  return c;
}
const cardBlob=()=>new Promise(r=>buildShareCard().toBlob(r,"image/png"));
$("#btnShare").onclick=async()=>{
  const txt=shareText();
  // 能「圖＋文」一起就一起；只能擇一→文字優先（Yo 裁定）
  let file=null;
  try{file=new File([await cardBlob()],"huajie-taiwan.png",{type:"image/png"})}catch{}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file],text:txt})){
    try{await navigator.share({text:txt,files:[file]});return}
    catch(e){if(e.name==="AbortError")return}   // 使用者取消就停，其他錯往下退
  }
  try{
    if(navigator.share)await navigator.share({text:txt});
    else{await navigator.clipboard.writeText(txt);toast("已複製，貼去炫耀吧")}
  }catch{}
};
$("#btnSaveImg").onclick=async()=>{
  try{
    const blob=await cardBlob();
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
      toast("成績圖已複製，直接貼上");return;
    }
    throw 0;
  }catch{
    try{
      const a=document.createElement("a");
      a.href=buildShareCard().toDataURL("image/png");
      a.download=`畫界台灣-${$("#puzzleNo").textContent.replace("#","")}.png`;
      a.click();toast("成績圖已下載");
    }catch{toast("這個瀏覽器存不了圖")}
  }
};

/* ── 啟動 ── */
fetch("counties-10t.json").then(r=>r.json()).then(t=>{
  topo=t;counties=t.objects.counties;geoms=counties.geometries;
  pool=buildPool();
  const n=dayNumber();
  const order=shuffled(pool,20260812);
  const pair=order[((n-1)%order.length+order.length)%order.length];
  $("#puzzleNo").textContent="#"+n;
  new ResizeObserver(resize).observe(cv);
  resize();
  loadRound(pair);
  // 開發測試鉤子：?test=perfect|offset|chord 自動作答（&mode=easy|free 強制模式），供 headless 驗計分
  const q=new URLSearchParams(location.search);
  if(q.get("mode")==="easy"||q.get("mode")==="free"){mode=q.get("mode");updateHint()}
  const testMode=q.get("test");
  if(testMode){setTimeout(()=>{
    if(testMode==="chord"){
      pts=resampleN([anchors[0].slice(),anchors[1].slice()],64);
    }else if(testMode==="human"){
      // 仿真人：只記得大形狀（重度平滑）＋側偏 6px＋尾巴超畫 40px（Yo 2026-08-31 實玩特徵）
      const B=resampleN(cur.borderPx,128);
      const S=B.map((p,i)=>{let sx=0,sy=0,n=0;
        for(let k=-7;k<=7;k++){const j=Math.max(0,Math.min(127,i+k));sx+=B[j][0];sy+=B[j][1];n++}
        return[sx/n+6,sy/n+4]});
      const last=S[S.length-1],prev=S[S.length-4];
      const dx=last[0]-prev[0],dy=last[1]-prev[1],L=Math.hypot(dx,dy)||1;
      for(let k=1;k<=5;k++)S.push([last[0]+dx/L*k*8,last[1]+dy/L*k*8]);
      pts=S;
    }else{
      const off=+(q.get("off")||30);
      pts=cur.borderPx.map(p=>testMode==="offset"?[p[0]+off,p[1]+off*0.6]:p.slice());
      if(testMode==="offset"){pts[0]=cur.borderPx[0].slice();pts[pts.length-1]=cur.borderPx[cur.borderPx.length-1].slice()}
    }
    finish();
    document.title=`TEST ${testMode} ${mode} score=${cur.lastPct}`;
    if(q.get("debug")){const d=computeScore().dbg;document.title+=" "+Object.entries(d).map(([k,v])=>`${k}=${v.toFixed(2)}`).join(" ")}
    if(q.get("card")){const img=new Image();img.src=buildShareCard().toDataURL("image/png");
      img.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#555;z-index:99";
      document.body.appendChild(img)}
  },600)}
}).catch(e=>{$("#task").textContent="地圖載入失敗："+e.message});
window.addEventListener("resize",resize);
</script>
