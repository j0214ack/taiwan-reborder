<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畫界台灣 — 畫出消失的縣市界線</title>
<meta name="description" content="兩個相鄰縣市之間的界線被擦掉了——憑印象把它畫回來，看看你劃錯了幾平方公里。">
<meta property="og:title" content="畫界台灣 — 畫出消失的縣市界線">
<meta property="og:description" content="兩個相鄰縣市的界線被擦掉了——憑印象畫回來。">
<meta property="og:url" content="https://yo-chen.dev/games/taiwan-reborder/">
<meta property="og:image" content="https://yo-chen.dev/games/taiwan-reborder/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://yo-chen.dev/games/taiwan-reborder/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗺️</text></svg>">
<!-- d3/topojson 自我託管（資安審查 M1：去 CDN 依賴，SRI 免疫＋「無追蹤」滴水不漏）；版本 d3@7.9.0 / topojson-client@3.1.0 -->
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<style>
:root{
  --paper:#F6F4EC; --paper2:#EFECE1; --ink:#22211C; --ink2:#6B675B; --ink3:#9B968A;
  --rule:#DCD8CA; --land:#E7E2D2; --landline:#4A4638;
  --me:#C8452F; --me-text:#B03A26; --truth:#1D6B62; --wrong:rgba(200,69,47,.28);
  --gold:#8A6A12;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  width:100%;max-width:560px;padding:14px 16px 6px;
  display:flex;align-items:baseline;gap:10px;flex:0 0 auto;
}
header b{font-size:20px;letter-spacing:.06em}
header .sub{font-size:12px;color:var(--ink2)}
header .no{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}

#task{
  width:100%;max-width:560px;padding:2px 16px 8px;flex:0 0 auto;
  font-size:14.5px;color:var(--ink2);line-height:1.55;
}
#task b{color:var(--ink)}
#task .vs{font-family:var(--mono);color:var(--ink3);padding:0 2px}

#stage{position:relative;width:100%;max-width:560px;flex:1;min-height:170px;padding:0 10px}
/* 總高塞不下（手機橫式揭曉）時允許整頁捲動，別把地圖壓扁 */
@media (max-height:560px){body{overflow:auto}}
#stage,canvas#map{
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
canvas#map{
  width:100%;height:100%;display:block;touch-action:none;
  border-radius:10px;background:
    radial-gradient(120% 90% at 30% 20%, #FAF8F1 0%, var(--paper2) 100%);
  border:1px solid var(--rule);
  cursor:crosshair;
}
#toast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;padding:7px 14px;
  border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;
  white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:.94}

/* 結果面板走文流、放在地圖下方（不遮地圖）；顯示時把 footer/credit 藏掉（Yo：蓋掉下面按鈕沒問題） */
#result{
  width:calc(100% - 20px);max-width:540px;flex:0 0 auto;
  background:rgba(250,248,241,.96);border:1px solid var(--rule);border-radius:12px;
  padding:13px 15px;margin-top:8px;display:none;
  box-shadow:0 8px 28px rgba(30,28,20,.14);
}
#result.show{display:block}
#result.show~footer,#result.show~.credit{display:none}
#result .score{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
#result .grade{font-size:15px;margin-left:8px}
#result .detail{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.6}
#result .detail b{color:var(--me-text)}
#result .detail .fine{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
#result .legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.sw{display:inline-block;width:16px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px;border-radius:2px}
#result .btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

footer{
  width:100%;max-width:560px;padding:10px 16px 6px;
  display:flex;gap:8px;align-items:center;flex:0 0 auto;
}
.credit{
  width:100%;max-width:560px;flex:0 0 auto;text-align:center;
  padding:0 16px calc(10px + env(safe-area-inset-bottom));
  font-size:11px;color:var(--ink2);
}
.credit a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--rule)}
button{
  font:inherit;font-size:14px;padding:9px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--rule);background:#FDFCF8;color:var(--ink);transition:.12s;
  touch-action:manipulation;min-height:44px;
}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary:hover{background:#000}
button:disabled{opacity:.4;cursor:not-allowed}
footer button{height:44px;padding:0;white-space:nowrap;flex:0 0 auto}
#btnClear{width:64px}
#btnPractice{width:76px}
#btnMode{width:96px}
footer .hint{margin-left:auto;font-size:12px;color:var(--ink2);text-align:right;line-height:1.4}
a.coffee{
  font-size:12px;color:var(--ink2);text-decoration:none;white-space:nowrap;
  border:1px solid var(--rule);border-radius:14px;padding:4px 10px;
  background:#FDFCF8;transition:.12s;
}
a.coffee:hover{border-color:var(--ink3);color:var(--ink)}
@media (max-height:640px){ header{padding-top:8px} #task{font-size:13px} }
@media (max-width:430px){
  header .sub{display:none}
  a.coffee{font-size:11px;padding:3px 8px}
}
</style>
</head>
<body>
<header>
  <b>畫界台灣</b><span class="sub">畫出消失的縣市界線</span>
  <a class="coffee" href="https://buy.stripe.com/dRm6oH8QZcgs9U119d7kc01" target="_blank" rel="noopener noreferrer">☕ 請我喝咖啡</a>
</header>
<div id="task">載入地圖中…</div>

<div id="stage">
  <canvas id="map" aria-label="地圖畫布：用手指或滑鼠畫出兩縣市之間的界線"></canvas>
  <div id="toast" role="status"></div>
</div>

<div id="result" role="status" aria-live="polite">
  <span class="score" id="score"></span><span class="grade" id="grade"></span>
  <div class="detail" id="detail"></div>
  <div class="legend">
    <span><span class="sw" style="border-color:var(--truth)"></span>真實界線</span>
    <span><span class="sw" style="border-color:var(--me)"></span>你畫的</span>
    <span><span style="display:inline-block;width:14px;height:11px;background:var(--wrong);vertical-align:middle;margin-right:4px;border-radius:2px"></span>劃錯的領土</span>
  </div>
  <div class="btns">
    <button class="primary" id="btnShare">分享成績</button>
    <button id="btnSaveImg">複製成績圖</button>
    <button id="btnAgain">再畫一次</button>
    <button id="btnNext">下一題</button>
  </div>
</div>

<footer>
  <button id="btnClear">重畫</button>
  <button id="btnPractice">下一題</button>
  <button id="btnMode">提示：關</button>
  <div class="hint" id="hint"></div>
</footer>
<div class="credit">靈感來自 <a href="https://reborder.app" target="_blank" rel="noopener noreferrer">reborder.app</a>・圖資 <a href="https://github.com/dkaoster/taiwan-atlas" target="_blank" rel="noopener noreferrer">taiwan-atlas</a>・作者 <a href="https://yo-chen.dev" target="_blank" rel="noopener">Yo Chen</a></div>

<script src="app.js"></script>
</body>
</html>
